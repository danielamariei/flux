apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gitops-poc
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/danielamariei/flux
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops-poc
  namespace: flux-system
spec:
  interval: 1m
  path: "./clusters/local"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux
  wait: true