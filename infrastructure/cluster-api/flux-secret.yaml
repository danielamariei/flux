apiVersion: v1
kind: Secret
metadata:
  name: flux-install
  namespace: default
type: addons.cluster.x-k8s.io/resource-set
stringData:
  flux.yaml: |
    apiVersion: v1
    kind: Namespace
    metadata:
      name: flux-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 15s
  url: https://github.com/danielamariei/flux
  ref:
    branch: main